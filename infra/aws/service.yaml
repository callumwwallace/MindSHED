AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MindSHED pilot API, private encrypted PostgreSQL, HTTPS ingress, managed
  secrets, audit trail, lifecycle job and budget alerts in one AWS region.

Parameters:
  ProjectName:
    Type: String
    Default: mindshed
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
  EnvironmentName:
    Type: String
    Default: pilot
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  ContainerImageUri:
    Type: String
    Description: Immutable ECR image URI including its tag.
  ApiDomainName:
    Type: String
    Description: API hostname, for example api.mindshedwellness.co.uk.
    AllowedPattern: "^[A-Za-z0-9.-]+$"
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 public hosted zone containing ApiDomainName.
  AlertEmail:
    Type: String
    Description: Monitored address for AWS budget notifications.
    AllowedPattern: "^[^@[:space:]]+@[^@[:space:]]+\\.[^@[:space:]]+$"
  ApiDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: Keep at zero until the database migration task succeeds.
  DatabaseName:
    Type: String
    Default: mindshed
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
  DatabaseUsername:
    Type: String
    Default: mindshed_admin
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  BackupRetentionDays:
    Type: Number
    Default: 14
    MinValue: 7
    MaxValue: 35
  DatabaseDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  LegalDocumentsApproved:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnablePilotEnrolment:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnablePilotUploads:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableSwemwbsUploads:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  MinimumAppVersion:
    Type: String
    Default: 1.0.0
    AllowedPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$"
  StudyCode:
    Type: String
    Default: mindshed-pilot-2026
    AllowedPattern: "^[A-Za-z0-9_-]{3,64}$"
  EnableLifecycleDeletion:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable only after every retention period has controller approval.
  AbandonedEnrolmentDays:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[1-9][0-9]*$"
  WithdrawnDataDays:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[1-9][0-9]*$"
  ParticipantRetentionDays:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[1-9][0-9]*$"
  ApplicationLogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90]
  AuditLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 180, 365]
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 500

Rules:
  ApprovalBeforeCollection:
    RuleCondition: !Or
      - !Equals [!Ref EnablePilotEnrolment, "true"]
      - !Equals [!Ref EnablePilotUploads, "true"]
      - !Equals [!Ref EnableSwemwbsUploads, "true"]
    Assertions:
      - Assert: !Equals [!Ref LegalDocumentsApproved, "true"]
        AssertDescription: LegalDocumentsApproved must be true before collection features can be enabled.
  LifecycleNeedsRetention:
    RuleCondition: !Equals [!Ref EnableLifecycleDeletion, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref AbandonedEnrolmentDays, ""]]
          - !Not [!Equals [!Ref WithdrawnDataDays, ""]]
          - !Not [!Equals [!Ref ParticipantRetentionDays, ""]]
        AssertDescription: Every retention period is required before lifecycle deletion can run.

Conditions:
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "true"]
  LegalApproved: !Equals [!Ref LegalDocumentsApproved, "true"]
  EnrolmentEnabled: !Equals [!Ref EnablePilotEnrolment, "true"]
  UploadsEnabled: !Equals [!Ref EnablePilotUploads, "true"]
  SwemwbsEnabled: !Equals [!Ref EnableSwemwbsUploads, "true"]
  LifecycleEnabled: !Equals [!Ref EnableLifecycleDeletion, "true"]
  HasAbandonedRetention: !Not [!Equals [!Ref AbandonedEnrolmentDays, ""]]
  HasWithdrawnRetention: !Not [!Equals [!Ref WithdrawnDataDays, ""]]
  HasParticipantRetention: !Not [!Equals [!Ref ParticipantRetentionDays, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}"
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-b"
  PrivateDataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-data-a"
  PrivateDataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-data-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public"
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateDataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-data"
  PrivateDataSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnetA
      RouteTableId: !Ref PrivateDataRouteTable
  PrivateDataSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnetB
      RouteTableId: !Ref PrivateDataRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress to the MindSHED API load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-alb"

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks accept traffic only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-api"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private PostgreSQL reachable only by the API task security group
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-database"

  AlbToApiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref ApiSecurityGroup
      Description: Load balancer to API tasks only

  ApiFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: HTTPS load balancer forwarding to API

  ApiHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: ECR, Secrets Manager and AWS service APIs

  ApiDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: 10.42.0.2/32
      Description: DNS queries to the VPC resolver

  ApiDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 53
      ToPort: 53
      CidrIp: 10.42.0.2/32
      Description: Large DNS responses to the VPC resolver

  ApiToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL in private data subnets

  DatabaseFromApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup
      Description: PostgreSQL from API tasks only

  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "MindSHED ${EnvironmentName} database and secrets encryption"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable account IAM policies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow encrypted application logs
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/${EnvironmentName}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: pseudonymous-special-category

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${EnvironmentName}-data"
      TargetKeyId: !Ref DataKey

  PilotCodeHashSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${ProjectName}/${EnvironmentName}/pilot-code-hash-key"
      Description: HMAC key used only to hash pilot invitation codes
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: security-secret

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MindSHED private database subnets
      SubnetIds:
        - !Ref PrivateDataSubnetA
        - !Ref PrivateDataSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${EnvironmentName}-postgres"
      DBName: !Ref DatabaseName
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !GetAtt DataKey.Arn
      MasterUsername: !Ref DatabaseUsername
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !GetAtt DataKey.Arn
      Port: 5432
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !If [ProtectDatabase, true, false]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PreferredBackupWindow: "02:00-03:00"
      PreferredMaintenanceWindow: "sun:03:30-sun:04:30"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DataClassification
          Value: pseudonymous-special-category

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${ProjectName}/${EnvironmentName}/api"
      RetentionInDays: !Ref ApplicationLogRetentionDays
      KmsKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: ReadMindShedRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref PilotCodeHashSecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadTemporaryPilotInviteSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/${EnvironmentName}/temporary-invite-*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}-api"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !Ref ContainerImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
              Name: http
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            - Name: DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: DATABASE_SSL_MODE
              Value: verify-full
            - Name: DRIZZLE_MIGRATIONS_PATH
              Value: apps/api/drizzle
            - Name: PILOT_LEGAL_DOCUMENTS_APPROVED
              Value: !If [LegalApproved, "true", "false"]
            - Name: PILOT_ENROLMENT_ENABLED
              Value: !If [EnrolmentEnabled, "true", "false"]
            - Name: PILOT_UPLOADS_ENABLED
              Value: !If [UploadsEnabled, "true", "false"]
            - Name: PILOT_SWEMWBS_UPLOADS_ENABLED
              Value: !If [SwemwbsEnabled, "true", "false"]
            - Name: PILOT_MARKETING_CONSENT_ENABLED
              Value: "false"
            - Name: PILOT_MINIMUM_APP_VERSION
              Value: !Ref MinimumAppVersion
            - Name: PILOT_MAX_EVENTS_PER_PARTICIPANT
              Value: "500"
            - Name: PILOT_MAX_CONSENTS_PER_PARTICIPANT
              Value: "50"
            - Name: RATE_LIMIT_MAX
              Value: "120"
            - Name: TRUST_PROXY
              Value: "false"
            - Name: PILOT_LIFECYCLE_EXECUTE
              Value: !If [LifecycleEnabled, "true", "false"]
            - Name: PILOT_LIFECYCLE_STUDY_CODE
              Value: !Ref StudyCode
            - !If
              - HasAbandonedRetention
              - Name: PILOT_ABANDONED_ENROLMENT_DAYS
                Value: !Ref AbandonedEnrolmentDays
              - !Ref AWS::NoValue
            - !If
              - HasWithdrawnRetention
              - Name: PILOT_WITHDRAWN_DATA_DAYS
                Value: !Ref WithdrawnDataDays
              - !Ref AWS::NoValue
            - !If
              - HasParticipantRetention
              - Name: PILOT_PARTICIPANT_RETENTION_DAYS
                Value: !Ref ParticipantRetentionDays
              - !Ref AWS::NoValue
          Secrets:
            - Name: DATABASE_USERNAME
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - SecretArn: !GetAtt Database.MasterUserSecret.SecretArn
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn: !GetAtt Database.MasterUserSecret.SecretArn
            - Name: PILOT_CODE_HASH_KEY
              ValueFrom: !Ref PilotCodeHashSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
              mode: non-blocking
              max-buffer-size: 1m
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: pseudonymous-special-category

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VpcGatewayAttachment
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-api"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.xff_header_processing.mode
          Value: remove
        - Key: access_logs.s3.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /ready
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ApiCertificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-api"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 3000
          TargetGroupArn: !Ref ApiTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ApiSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EventTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunLifecycleTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ApiTaskDefinition
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  LifecycleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-data-lifecycle"
      Description: Runs approved MindSHED retention and expiry rules once per day
      ScheduleExpression: cron(20 2 * * ? *)
      State: !If [LifecycleEnabled, ENABLED, DISABLED]
      Targets:
        - Id: DataLifecycleTask
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventTaskRole.Arn
          Input: '{"containerOverrides":[{"name":"api","command":["node","apps/api/dist/run-data-lifecycle.cjs"]}]}'
          EcsParameters:
            TaskDefinitionArn: !Ref ApiTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref ApiSecurityGroup
                Subnets:
                  - !Ref PublicSubnetA
                  - !Ref PublicSubnetB

  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: DeleteExpiredManagementAuditLogs
            Status: Enabled
            ExpirationInDays: !Ref AuditLogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: administrative-audit-metadata

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${EnvironmentName}-management"
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${EnvironmentName}-management"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ManagementTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub "${ProjectName}-${EnvironmentName}-management"
      S3BucketName: !Ref AuditBucket
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: false
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-${EnvironmentName}-monthly"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiDomainName}"
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  TaskDefinitionArn:
    Value: !Ref ApiTaskDefinition
  ApiServiceArn:
    Value: !Ref ApiService
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  DataKmsKeyArn:
    Value: !GetAtt DataKey.Arn
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  PilotCodeHashSecretArn:
    Value: !Ref PilotCodeHashSecret
  ApiLogGroupName:
    Value: !Ref ApiLogGroup
  LifecycleRuleArn:
    Value: !GetAtt LifecycleRule.Arn
  AuditBucketName:
    Value: !Ref AuditBucket
